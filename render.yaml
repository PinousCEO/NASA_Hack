# Render blueprint: one web service that runs the whole game (the Node server serves the web client too).
# In Render: New + → Blueprint → pick this repository. The game needs a long-running server with WebSockets,
# so it cannot run on static or serverless hosting (Vercel, Netlify).
services:
  - type: web
    name: mission-forge
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm --prefix apps/web install --include=dev && npm run build:web
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      # The language model. Set the key in the Render dashboard (Environment), never in this file. With a key on a
      # public server, every visitor's requests to the AI are billed to it.
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-6-astra
